name: Build U200B Matrix APK

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and unpack U200B project
        run: |
          cat chatgpt-build/u200b-project.b64.001 \
              chatgpt-build/u200b-project.b64.002 \
              chatgpt-build/u200b-project.b64.003 \
              chatgpt-build/u200b-project.b64.004 \
              chatgpt-build/u200b-project.b64.005a \
              chatgpt-build/u200b-project.b64.005b \
              | base64 -d > /tmp/u200b-project.zip
          unzip -t /tmp/u200b-project.zip
          mkdir -p build-u200b
          unzip -q /tmp/u200b-project.zip -d build-u200b
          sed -i 's/new Random(200B)/new Random(0x200BL)/g' build-u200b/app/src/main/java/com/dmitriy/u200btextutility/MatrixRainView.java
          grep -n 'new Random' build-u200b/app/src/main/java/com/dmitriy/u200btextutility/MatrixRainView.java

      - name: Restore persistent signing key
        run: |
          base64 -d chatgpt-build/u200b-release.p12.b64 > /tmp/u200b-release.p12
          keytool -list -v \
            -storetype PKCS12 \
            -keystore /tmp/u200b-release.p12 \
            -storepass U200B-Release-2026 \
            -alias u200b-release >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK
        working-directory: build-u200b
        run: gradle --no-daemon :app:assembleRelease

      - name: Align, sign, and verify APK
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          UNSIGNED="build-u200b/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="build-u200b/app/build/outputs/apk/release/U200B_TextMatrix_3.3_aligned.apk"
          FINAL="build-u200b/app/build/outputs/apk/release/U200B_TextMatrix_Android_3.3_INSTALL.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks /tmp/u200b-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias u200b-release \
            --ks-pass pass:U200B-Release-2026 \
            --key-pass pass:U200B-Release-2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$FINAL" | tee build-u200b/app/build/outputs/apk/release/zipalign-report.txt
          "$BT/apksigner" verify --verbose --print-certs "$FINAL" | tee build-u200b/app/build/outputs/apk/release/signature-report.txt
          sha256sum "$FINAL" | tee build-u200b/app/build/outputs/apk/release/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: U200B-TextMatrix-Android-3.3-PersistentKey
          path: |
            build-u200b/app/build/outputs/apk/release/U200B_TextMatrix_Android_3.3_INSTALL.apk
            build-u200b/app/build/outputs/apk/release/signature-report.txt
            build-u200b/app/build/outputs/apk/release/zipalign-report.txt
            build-u200b/app/build/outputs/apk/release/SHA256.txt
          if-no-files-found: error
